name: Build and deploy plugin data to GitHub Pages

on:
  schedule:
    # Every 30 minutes. yr.no data itself typically updates roughly hourly.
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Each fetch step uses continue-on-error so one plugin's transient
      # failure (e.g. a source site timing out) doesn't block the others
      # from getting fresh data or from deploying this cycle. Any plugin
      # that fails falls back to its last-published data.json (see the
      # "Fall back..." step below) instead of disappearing from Pages.

      # --- Plugin #1: weather-yr ---
      - name: Fetch weather-yr data
        continue-on-error: true
        run: node plugins/weather-yr/fetch.mjs

      # --- Plugin #2: lunch-lerum ---
      - name: Fetch lunch-lerum data
        continue-on-error: true
        run: node plugins/lunch-lerum/fetch.mjs

      # --- Plugin #3: bus-grabo ---
      - name: Fetch bus-grabo data
        continue-on-error: true
        env:
          VASTTRAFIK_AUTH_KEY: ${{ secrets.VASTTRAFIK_AUTH_KEY }}
        run: node plugins/bus-grabo/fetch.mjs

      # Add future plugins here, e.g.:
      # - name: Fetch plugin4 data
      #   continue-on-error: true
      #   run: node plugins/plugin4/fetch.mjs

      - name: Fall back to last published data for any plugin that failed
        run: |
          set -e
          PLUGINS="weather-yr lunch-lerum bus-grabo"
          for p in $PLUGINS; do
            if [ ! -f "public/$p/data.json" ]; then
              echo "No fresh data.json for $p this run - trying last published version"
              mkdir -p "public/$p"
              curl -fsSL "https://hikmek.github.io/trmnl_plugins/$p/data.json" -o "public/$p/data.json" \
                || echo "No previously published data.json for $p either - skipping"
            fi
          done

      - name: Add Pages index
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html><body>
          <h1>trmnl_plugins data feeds</h1>
          <ul>
            <li><a href="weather-yr/data.json">weather-yr/data.json</a></li>
            <li><a href="lunch-lerum/data.json">lunch-lerum/data.json</a></li>
            <li><a href="bus-grabo/data.json">bus-grabo/data.json</a></li>
          </ul>
          </body></html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
