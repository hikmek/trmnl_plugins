name: Build and deploy plugin data to GitHub Pages

on:
  schedule:
    # Every 5 minutes, to support the banksy plugin's rotation. The other
    # plugins are internally throttled to their own slower cadence (see
    # the "throttled" steps below) so we don't hammer yr.no/lerum.se/
    # Vasttrafik every 5 minutes - only banksy (a local file pick, no
    # external network call) actually runs on every single cycle.
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Manual runs (workflow_dispatch) always bypass the throttles below -
      # if you're triggering it by hand, you want fresh data now.
      FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Each fetch step uses continue-on-error so one plugin's transient
      # failure (e.g. a source site timing out) doesn't block the others
      # from getting fresh data or from deploying this cycle. Any plugin
      # that fails (or is throttled/skipped this cycle) falls back to its
      # last-published data.json (see the "Fall back..." step below).

      # --- Plugin #1: weather-yr (throttled to ~every 30 min) ---
      - name: Fetch weather-yr data
        continue-on-error: true
        run: |
          minute=$(date -u +%M)
          if [ "$FORCE_FETCH" = "true" ] || [ $(( 10#$minute % 30 )) -eq 0 ]; then
            node plugins/weather-yr/fetch.mjs
          else
            echo "Skipping weather-yr fetch this cycle (throttled to every 30 min)"
          fi

      # --- Plugin #2: lunch-lerum (throttled to ~every 30 min) ---
      - name: Fetch lunch-lerum data
        continue-on-error: true
        run: |
          minute=$(date -u +%M)
          if [ "$FORCE_FETCH" = "true" ] || [ $(( 10#$minute % 30 )) -eq 0 ]; then
            node plugins/lunch-lerum/fetch.mjs
          else
            echo "Skipping lunch-lerum fetch this cycle (throttled to every 30 min)"
          fi

      # --- Plugin #3: bus-grabo (throttled to ~every 10 min) ---
      - name: Fetch bus-grabo data
        continue-on-error: true
        env:
          VASTTRAFIK_AUTH_KEY: ${{ secrets.VASTTRAFIK_AUTH_KEY }}
        run: |
          minute=$(date -u +%M)
          if [ "$FORCE_FETCH" = "true" ] || [ $(( 10#$minute % 10 )) -eq 0 ]; then
            node plugins/bus-grabo/fetch.mjs
          else
            echo "Skipping bus-grabo fetch this cycle (throttled to every 10 min)"
          fi

      # --- Plugin #4: banksy (runs every cycle - no external network call,
      #     just picks a random pre-generated image from the committed
      #     gallery/) ---
      - name: Fetch banksy data
        continue-on-error: true
        run: node plugins/banksy/fetch.mjs

      # Add future plugins here, e.g.:
      # - name: Fetch plugin5 data
      #   continue-on-error: true
      #   run: node plugins/plugin5/fetch.mjs

      - name: Copy banksy static gallery images
        run: |
          mkdir -p public/banksy/gallery
          cp plugins/banksy/gallery/*.png public/banksy/gallery/

      - name: Copy weather-yr static icon images
        run: |
          mkdir -p public/weather-yr/icons
          cp plugins/weather-yr/icons/*.png public/weather-yr/icons/

      - name: Fall back to last published data for any plugin that failed
        run: |
          set -e
          PLUGINS="weather-yr lunch-lerum bus-grabo banksy"
          for p in $PLUGINS; do
            if [ ! -f "public/$p/data.json" ]; then
              echo "No fresh data.json for $p this run - trying last published version"
              mkdir -p "public/$p"
              curl -fsSL "https://hikmek.github.io/trmnl_plugins/$p/data.json" -o "public/$p/data.json" \
                || echo "No previously published data.json for $p either - skipping"
            fi
          done

      - name: Add Pages index
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html><body>
          <h1>trmnl_plugins data feeds</h1>
          <ul>
            <li><a href="weather-yr/data.json">weather-yr/data.json</a></li>
            <li><a href="lunch-lerum/data.json">lunch-lerum/data.json</a></li>
            <li><a href="bus-grabo/data.json">bus-grabo/data.json</a></li>
            <li><a href="banksy/data.json">banksy/data.json</a></li>
          </ul>
          </body></html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
